# Documentation Standards Configuration
# Defines style, format, and quality standards for all documentation

standards:
  name: "Documentation Quality Standards"
  version: "2.0.0"
  description: "Comprehensive standards for consistent, high-quality documentation"

# Content Standards
content:
  writing_style:
    voice: "Professional, friendly, and accessible"
    tone: "Helpful expert guiding users to success"
    person: "Second person (you/your) for instructions, third person for descriptions"
    tense: "Present tense for current features, future tense for roadmap items"
    
  language_guidelines:
    reading_level: "8th grade maximum for business docs, 10th grade for technical"
    sentence_length: "20 words maximum average"
    paragraph_length: "4 sentences maximum"
    jargon_policy: "Define all technical terms on first use"
    
  accessibility:
    plain_language: true
    alt_text_required: true
    heading_hierarchy: "Proper H1-H6 structure"
    color_contrast: "WCAG AA compliant"
    link_descriptions: "Descriptive, not 'click here'"

# Structure Standards
structure:
  document_template:
    required_sections:
      - "Overview/Introduction"
      - "Prerequisites (when applicable)"
      - "Main content sections"
      - "Examples/Code samples"
      - "Troubleshooting (when applicable)"
      - "Next steps/Related resources"
    
    optional_sections:
      - "Quick start guide"
      - "Advanced usage"
      - "Best practices"
      - "FAQ section"
      - "Glossary"

  heading_standards:
    h1: "Document title only (one per document)"
    h2: "Major sections"
    h3: "Subsections within major sections"
    h4: "Sub-subsections (use sparingly)"
    h5_h6: "Avoid unless absolutely necessary"
    
  content_organization:
    progressive_disclosure: "Simple to complex information flow"
    task_oriented: "Organize around user goals, not system features"
    scannable: "Use lists, tables, and visual breaks"
    cross_references: "Link related content appropriately"

# Format Standards
formatting:
  markdown:
    code_blocks:
      language_specification: "Always specify language for syntax highlighting"
      complete_examples: "Show full context, not fragments"
      expected_output: "Include expected results when helpful"
      
    lists:
      bullet_style: "Use - for unordered lists"
      numbered_style: "Use 1. for ordered lists"
      nesting: "Maximum 3 levels deep"
      
    emphasis:
      bold: "**text** for UI elements, important concepts"
      italic: "*text* for emphasis, first-time terms"
      code_inline: "`text` for code, file names, commands"
      
    tables:
      headers: "Always include header row"
      alignment: "Left-align text, right-align numbers"
      complexity: "Maximum 5 columns for readability"
      
    images:
      format: "PNG for screenshots, SVG for diagrams"
      alt_text: "Descriptive alternative text required"
      captions: "Use for complex images requiring explanation"
      file_naming: "descriptive-kebab-case.png"

  code_standards:
    languages:
      javascript:
        style: "ES6+ syntax, const/let over var"
        formatting: "2-space indentation, semicolons"
        examples: "Async/await over promises when clearer"
        
      typescript:
        style: "Explicit types for parameters and returns"
        formatting: "Follow JavaScript conventions"
        examples: "Show interface definitions when helpful"
        
      python:
        style: "PEP 8 compliant"
        formatting: "4-space indentation"
        examples: "Type hints when helpful for clarity"
        
      bash:
        style: "POSIX compatible when possible"
        formatting: "Clear variable naming"
        examples: "Include error handling for critical operations"
        
    universal_rules:
      security: "Never include real API keys, passwords, or secrets"
      testing: "All code examples must be tested and working"
      context: "Provide enough context for examples to be useful"
      comments: "Explain non-obvious code behavior"

# Visual Standards
visuals:
  diagrams:
    tool: "Mermaid for system diagrams, process flows"
    style: "Clean, minimal design"
    colors: "Use brand colors consistently"
    complexity: "Maximum 7-9 elements per diagram"
    
  screenshots:
    resolution: "High DPI, clear text"
    annotations: "Clear callouts with contrast"
    currency: "Update when UI changes significantly"
    consistency: "Same browser/OS when possible"
    
  charts_graphs:
    tool: "Simple, accessible chart formats"
    data_labels: "Always include axis labels and units"
    color_blind_friendly: "Use patterns and shapes, not just color"
    
# Quality Assurance
quality_assurance:
  review_checklist:
    technical_accuracy:
      - "All code examples tested and working"
      - "API documentation matches current implementation"
      - "Screenshots reflect current UI"
      - "Links are functional"
      
    content_quality:
      - "Appropriate for target audience"
      - "Complete coverage of topic"
      - "Clear, actionable instructions"
      - "Logical flow and organization"
      
    standards_compliance:
      - "Consistent formatting throughout"
      - "Proper heading hierarchy"
      - "Required sections present"
      - "Accessibility guidelines followed"
      
  user_testing:
    frequency: "For all major documentation updates"
    participants: "3-5 users from target audience"
    tasks: "Complete realistic user workflows"
    success_criteria: "80% task completion rate minimum"
    
  maintenance:
    review_cycle: "Quarterly for active documentation"
    update_triggers:
      - "Product feature changes"
      - "User feedback indicating issues"
      - "Support ticket patterns"
      - "Analytics showing high bounce rates"
      
    deprecation_policy:
      - "Mark outdated content clearly"
      - "Provide migration paths when possible"
      - "Remove completely outdated content"
      - "Maintain redirect links for 6 months"

# Measurement and Analytics
measurement:
  success_metrics:
    user_focused:
      - "Task completion rates"
      - "Time to complete tasks"
      - "User satisfaction scores"
      - "Return visit frequency"
      
    business_focused:
      - "Support ticket reduction"
      - "Feature adoption rates"
      - "Developer onboarding time"
      - "API integration success rates"
      
  data_collection:
    analytics: "Page views, time on page, bounce rates"
    feedback: "Embedded feedback widgets"
    testing: "Regular user testing sessions"
    support: "Support ticket categorization and trends"
    
  reporting:
    frequency: "Monthly operational, quarterly strategic"
    stakeholders: "Documentation team, product management, support"
    format: "Executive summary with detailed appendix"
    actions: "Specific improvement recommendations"